<div class="flex h-full flex-col">
    <!-- Sidebar Header -->
    <div class="px-4 py-3 mt-16 dark:border-slate-700">
        <h3 class="block text-lg font-semibold text-slate-800 md:hidden dark:text-slate-100">Menu</h3>
    </div>

    <div class="flex-1 overflow-auto">
        <ul class="border-0">
            @for (item of $any([]); track $index) {
                <li>
                    <a
                        class="flex items-center px-4 py-2 text-slate-700 hover:bg-slate-200 dark:text-slate-300 dark:hover:bg-slate-700"
                        [routerLink]="item.routerLink"
                        routerLinkActive="bg-slate-100 dark:bg-slate-600 font-bold"
                        [routerLinkActiveOptions]="{ exact: true }"
                        (click)="itemClick($event)"
                    >
                        <i class="{{ item.icon }} mr-3"></i>
                        <span>{{ item.label }}</span>
                    </a>
                </li>
            }
        </ul>
    </div>

    <!-- Sidebar Footer -->
    <div class="border-t border-border px-4 py-3">
        <p class="text-sm text-slate-500 dark:text-slate-400">Version 1.0.0</p>
    </div>
</div>
