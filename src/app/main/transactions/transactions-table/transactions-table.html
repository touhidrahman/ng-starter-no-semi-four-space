<div hlmTableContainer class="min-h-50">
    <table hlmTable>
        <thead hlmTHead>
            <tr hlmTr>
                <th hlmTh>Transaction ID</th>
                <th hlmTh>Date</th>
                <th hlmTh>Payee</th>
                <th hlmTh>Amount</th>
                <th hlmTh>Category</th>
                <th hlmTh>Account</th>
            </tr>
        </thead>
        <tbody hlmTbody>
            @for (t of transactions(); track t.id) {
                <tr hlmTr>
                    <td hlmTd>{{ t.id }}</td>
                    <td hlmTd>{{ t.date | date: 'mediumDate' }}</td>
                    <td hlmTd>{{ t.payee }}</td>
                    <td hlmTd>{{ t.amount | currency }}</td>
                    <td hlmTd>
                        <span
                            class="rounded-full px-2 py-0.5 text-xs font-medium"
                            [ngClass]="{
                                'bg-blue-100 text-blue-800':
                                    t.category === TransactionCategory.FoodAndDrink,
                                'bg-green-100 text-green-800':
                                    t.category === TransactionCategory.Shopping,
                                'bg-yellow-100 text-yellow-800':
                                    t.category === TransactionCategory.Transport,
                                'bg-red-100 text-red-800':
                                    t.category === TransactionCategory.Utilities,
                                'bg-purple-100 text-purple-800':
                                    t.category === TransactionCategory.Entertainment,
                                'bg-pink-100 text-pink-800':
                                    t.category === TransactionCategory.Healthcare,
                                'bg-indigo-100 text-indigo-800':
                                    t.category === TransactionCategory.Education,
                                'bg-gray-100 text-gray-800':
                                    t.category === TransactionCategory.Travel,
                                'bg-teal-100 text-teal-800':
                                    t.category === TransactionCategory.Miscellaneous,
                            }"
                        >
                            {{ t.category }}
                        </span>
                    </td>
                    <td hlmTd>{{ t.account }}</td>
                </tr>
            }
        </tbody>
    </table>
</div>
